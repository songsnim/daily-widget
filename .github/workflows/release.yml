# Push a tag like v1.0.1: builds the APK signed with the same debug key as local installs
# (so updates install over the existing app) and attaches it to a GitHub Release for Obtainium.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: echo "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
      # Explicit injected signing: the runner's own debug keystore location is not ~/.android.
      - name: Build
        run: >
          bash ./gradlew assembleDebug -PversionCode=$((GITHUB_RUN_NUMBER + 1)) -PversionName=${GITHUB_REF_NAME#v}
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/debug.keystore
          -Pandroid.injected.signing.store.password=android
          -Pandroid.injected.signing.key.alias=androiddebugkey
          -Pandroid.injected.signing.key.password=android
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk daily-widget-$GITHUB_REF_NAME.apk
          gh release create "$GITHUB_REF_NAME" daily-widget-$GITHUB_REF_NAME.apk --generate-notes
